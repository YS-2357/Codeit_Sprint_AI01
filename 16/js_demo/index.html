<!-- index.html -->
<!DOCTYPE html>  <!-- HTML5 문서 선언 -->
<html lang="en">  <!-- 문서의 언어를 영어로 설정 -->
<head>
  <meta charset="UTF-8">  <!-- 문자 인코딩을 UTF-8로 설정 -->
  <title>MNIST ONNX Demo</title>  <!-- 브라우저 탭에 표시될 제목 -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>  <!-- ONNX Runtime Web 라이브러리 불러오기 -->
  <style>
    canvas { border: 1px solid black; }  /* 캔버스 테두리 스타일 지정 */
  </style>
</head>
<body>
  <h2>✏️ 숫자 이미지 업로드 (28x28 또는 흰 글자/검 배경)</h2>  <!-- 안내 문구 -->
  <input type="file" id="fileInput" accept="image/*"><br><br>  <!-- 이미지 파일 업로드용 input 요소 -->
  <canvas id="canvas" width="280" height="280"></canvas><br>  <!-- 사용자가 업로드한 이미지를 그릴 캔버스 -->
  <button onclick="predict()">예측하기</button>  <!-- 예측 실행 버튼 -->
  <p id="result">결과: </p>  <!-- 예측 결과를 표시할 영역 -->

  <script src="app.js"></script>  <!-- 자바스크립트 코드(app.js) 불러오기 -->
</body>
</html>
